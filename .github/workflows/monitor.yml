name: Chrome Hearts Drop Monitor on: schedule: - cron: '\*/5 \* \* \* \*' # Runs automatically every 5 minutes workflow\_dispatch: # Allows manual trigger from Actions tab jobs: check-drop: runs-on: ubuntu-latest permissions: contents: write steps: - name: Checkout Code uses: actions/checkout@v4 - name: Set up Python uses: actions/setup-python@v5 with: python-version: '3.10' - name: Run Monitor run: python monitor.py - name: Commit Updated State run: | git config --global user.name "Drop Bot" git config --global user.email "bot@github.local" git add seen\_products.json git diff --quiet &amp;&amp; git diff --staged --quiet || (git commit -m "Update seen state" &amp;&amp; git push)
